name: Daily Past Events Cleanup

on:
  schedule:
    # Runs every day at 03:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cleanup Endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: "https://victoriareindalesoprano.com"
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Error: CRON_SECRET is not configured in repository secrets."
            exit 1
          fi

          echo "Triggering past events cleanup for $SITE_URL..."
          RESPONSE=$(curl -s -X POST -w "\nHTTP_STATUS:%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/cleanup-events")
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e 's/HTTP_STATUS\:.*//g')
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\n' | sed -e 's/.*HTTP_STATUS://')
          
          echo "Response body: $HTTP_BODY"
          echo "HTTP status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Cleanup failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
          
          echo "Cleanup completed successfully!"
